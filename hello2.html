<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My ChatGPT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #343541;
      color: white;
      height: 100vh;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: #202123;
      padding: 15px;
    }

    .new-chat {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: white;
      border: 1px solid #565869;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    .new-chat:hover {
      background: #2a2b32;
    }

    .sidebar h3 {
      margin-top: 30px;
      color: #aaa;
      font-size: 14px;
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      padding: 18px;
      border-bottom: 1px solid #555;
      font-size: 20px;
      font-weight: bold;
    }

    /* Chat */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 800px;
      margin: 15px auto;
      padding: 15px;
      border-radius: 8px;
      line-height: 1.5;
    }

    .user {
      background: #444654;
    }

    .bot {
      background: #343541;
    }

    /* Input */
    .input-area {
      padding: 20px;
      background: #343541;
    }

    .input-box {
      max-width: 800px;
      margin: auto;
      display: flex;
      background: #40414f;
      border-radius: 8px;
      padding: 8px;
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      padding: 12px;
      font-size: 16px;
    }

    button {
      background: #19c37d;
      border: none;
      color: white;
      padding: 0 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #15a96b;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .sidebar {
        display: none;
      }

      .message,
      .input-box {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <button class="new-chat" onclick="newChat()">+ New chat</button>
    <h3>Chat History</h3>
  </div>

  <!-- Main Chat -->
  <div class="main">

    <div class="header">
      My ChatGPT
    </div>

    <div class="chat" id="chat">
      <div class="message bot">
        👋 Hello! How can I help you today?
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-box">
        <input
          type="text"
          id="messageInput"
          placeholder="Message ChatGPT..."
          onkeydown="handleKey(event)"
        >

        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const chat = document.getElementById("chat");

      const message = input.value.trim();

      if (message === "") return;

      // User message
      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = message;

      chat.appendChild(userMessage);

      input.value = "";

      // Fake AI response
      setTimeout(() => {
        const botMessage = document.createElement("div");
        botMessage.className = "message bot";

        botMessage.textContent =
          "This is a demo AI response. You said: " + message;

        chat.appendChild(botMessage);

        chat.scrollTop = chat.scrollHeight;
      }, 700);

      chat.scrollTop = chat.scrollHeight;
    }

    function handleKey(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    function newChat() {
      document.getElementById("chat").innerHTML = `
        <div class="message bot">
          👋 New chat started. How can I help you?
        </div>
      `;
    }
  </script>

</body>
</html>
